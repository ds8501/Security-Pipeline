name: Keep Render awake

# Pings the deployed service every ~10 minutes so Render's free tier doesn't spin
# the instance down (which causes a slow ~30-60s cold start on the next request).
# Note: only runs while GitHub Actions is enabled/unblocked for the account.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sSf --max-time 90 https://security-pipeline.onrender.com/api/health
