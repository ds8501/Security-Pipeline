name: Security Pipeline Gate 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    name: Security Gate 1 - Tests & Scanning
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        working-directory: ./scanner-service
        run: mvn test

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Semgrep scan
        run: |
          semgrep --config=p/security-audit \
            --json \
            --output=semgrep-results.json \
            scanner-service/src/main/java || true

      - name: Gitleaks secret scan
        run: |
          docker run --rm -v $(pwd):/repo zricethezav/gitleaks:latest detect --source /repo --report-path /repo/gitleaks-results.json --exit-code 0 || true

      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: scan-results
          path: |
            semgrep-results.json
            gitleaks-results.json

      - name: Fail on critical findings
        run: |
          if [ -f semgrep-results.json ]; then
            CRITICAL_COUNT=$(jq '.results | map(select(.extra.severity == "ERROR")) | length' semgrep-results.json || echo 0)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ Found $CRITICAL_COUNT critical Semgrep issues"
              exit 1
            fi
          fi

  build-service:
    runs-on: ubuntu-latest
    name: Build Service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build scanner-service
        working-directory: ./scanner-service
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: scanner-service-jar
          path: scanner-service/target/*.jar
