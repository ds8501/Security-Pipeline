name: Security Pipeline Gate 2 - AI Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-security-review:
    runs-on: ubuntu-latest
    name: Security Gate 2 - AI-Powered Review
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build scanner-service
        working-directory: ./scanner-service
        run: mvn clean package -DskipTests -q

      - name: Get PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          git diff "origin/${BASE_REF}..HEAD" > /tmp/pr.diff
          echo "=== PR Diff ==="
          head -50 /tmp/pr.diff

      - name: Run security pipeline review
        working-directory: ./scanner-service
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Scanning PR: ${HEAD_REF}"

          # Check for sensitive keywords in diff
          if grep -qi "password\|secret\|token\|key\|credential" /tmp/pr.diff; then
            echo "⚠️  Potential credential leak detected"
          fi

          # Check for unsafe patterns
          if grep -qi "logger.info.*user\|console.log.*secret" /tmp/pr.diff; then
            echo "⚠️  Sensitive data logging detected"
          fi

          echo "Review complete"

      - name: Comment PR with findings
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            
            let findings = [];
            
            // Check diff for issues
            const diffContent = require('fs').readFileSync('/tmp/pr.diff', 'utf8');
            
            if (diffContent.includes('vulnerable') || diffContent.includes('secret') || diffContent.includes('unsafe')) {
              findings.push({
                severity: 'BLOCKED',
                title: 'Potential security issue detected',
                message: 'The diff contains patterns that may indicate security risks. Please review before merge.'
              });
            }
            
            if (findings.length > 0) {
              let comment = '## 🔐 Security Pipeline Review\n\n';
              comment += '### ⛔ BLOCKED - Critical Issues Found\n\n';
              findings.forEach(f => {
                comment += `- **${f.title}**: ${f.message}\n`;
              });
              comment += '\nPlease address these issues before the PR can be merged.';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
              core.setFailed('Security issues found - PR review blocked');
            } else {
              let comment = '## 🔐 Security Pipeline Review\n\n';
              comment += '### ✅ PASS - No critical issues detected\n\n';
              comment += 'This PR passed automated security review. Ready for merge.';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Set PR check status
        if: always()
        run: |
          echo "Security pipeline review complete"
