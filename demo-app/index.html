<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Pipeline Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Automated review</p>
          <h1>Security Pipeline</h1>
        </div>
      </header>

      <main class="layout">
        <section class="panel trigger-panel">
          <h2>Trigger panel</h2>
          <form id="scan-form">
            <label>
              Repository URL
              <input id="repoUrl" name="repoUrl" type="url" placeholder="https://github.com/org/project" required />
            </label>

            <label>
              Branch
              <input id="branch" name="branch" type="text" value="feature/demo" />
            </label>

            <button type="submit">Run Scan</button>
          </form>

          <div class="status-box">
            <h3>Live status</h3>
            <ul id="status-log"></ul>
          </div>
        </section>

        <section class="panel dashboard-panel">
          <div class="panel-header">
            <h2>Scan dashboard</h2>
          </div>
          <table>
            <thead>
              <tr>
                <th>Scan</th>
                <th>Branch</th>
                <th>Verdict</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="scan-table-body"></tbody>
          </table>
        </section>

        <section class="panel detail-panel">
          <div class="panel-header">
            <h2>Scan detail</h2>
          </div>
          <div id="scan-detail"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
