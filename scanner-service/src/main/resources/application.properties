spring.datasource.url=jdbc:h2:mem:security-pipeline;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.mvc.async.request-timeout=600000
server.port=8080
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.5-flash}
secgate.semgrep-binary=${SEMGREP_BINARY:semgrep}
