server.port=8080
spring.mvc.async.request-timeout=600000

# Gate 2 - LLM review
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.5-flash}
secgate.semgrep-binary=${SEMGREP_BINARY:semgrep}

# Gate 1 - GitHub Actions trigger (optional). When token+repo are set, /api/gate1 dispatches
# the workflow and polls the run; otherwise it runs the checks locally as subprocesses.
gate1.github.token=${GITHUB_TOKEN:}
gate1.github.repo=${GITHUB_REPO:}
gate1.github.workflow=${GITHUB_WORKFLOW:security-gate-1.yml}
gate1.github.ref=${GITHUB_REF_NAME:main}
