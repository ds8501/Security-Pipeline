spring.datasource.url=jdbc:h2:mem:security-pipeline;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.mvc.async.request-timeout=600000
server.port=8080
llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
secgate.semgrep-binary=${SEMGREP_BINARY:semgrep}
# Gate-1 tool binaries (override if not on PATH; a missing binary is reported as UNAVAILABLE).
secgate.gitleaks-binary=${GITLEAKS_BINARY:gitleaks}
secgate.osv-scanner-binary=${OSV_SCANNER_BINARY:osv-scanner}
secgate.trivy-binary=${TRIVY_BINARY:trivy}
secgate.syft-binary=${SYFT_BINARY:syft}
secgate.actionlint-binary=${ACTIONLINT_BINARY:actionlint}
secgate.zizmor-binary=${ZIZMOR_BINARY:zizmor}
secgate.gate1.semgrep-config=${GATE1_SEMGREP_CONFIG:p/security-audit}
# Gate-2 sandboxed test proof (runs LLM-generated check scripts in a network-disabled Docker
# container). Opt-in: disabled unless SANDBOX_ENABLED=true and Docker is available on the host.
secgate.sandbox.enabled=${SANDBOX_ENABLED:false}
secgate.docker-binary=${DOCKER_BINARY:docker}
secgate.sandbox.image=${SANDBOX_IMAGE:python:3.12-alpine}
secgate.sandbox.timeout-seconds=${SANDBOX_TIMEOUT_SECONDS:90}
# Gate-2 supporting tools (code search / structure / policy). Missing binaries degrade gracefully.
secgate.ripgrep-binary=${RIPGREP_BINARY:rg}
secgate.tree-sitter-binary=${TREE_SITTER_BINARY:tree-sitter}
secgate.opa-binary=${OPA_BINARY:opa}

# Differentiator features
secgate.github-token=${GITHUB_TOKEN:}
secgate.attestation.key=${ATTESTATION_KEY:secgate-dev-signing-key-change-me}
